name: software-contracts
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,server]'
      - run: python tools/validate.py --out /tmp/agmina-validation --loopback
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.python }}
          path: /tmp/agmina-validation/*.log
